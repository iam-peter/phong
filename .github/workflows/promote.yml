name: Promote Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, for example 1.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Download nightly assets
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 1.2.0 or 1.2.0-rc.1" >&2
            exit 1
          fi
          mkdir artifacts
          gh release download nightly --repo "$GH_REPO" --dir artifacts
          gh api "repos/$GH_REPO/commits/nightly" --jq '.sha' > nightly-sha
          echo "sha=$(cat nightly-sha)" >> "$GITHUB_OUTPUT"

      # The start page and the version from the commit the nightly was built from
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.nightly.outputs.sha }}
          path: source

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          built=$(sed -n 's/^project(phong VERSION \([0-9.]*\).*/\1/p' source/CMakeLists.txt)
          if [ "${VERSION%%-*}" != "$built" ]; then
            echo "The nightly is version $built, set project(VERSION) in CMakeLists.txt first" >&2
            exit 1
          fi

      - name: Create stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          commit=$(cat nightly-sha)
          echo "Promoting nightly at $commit to $tag"
          gh release create "$tag" artifacts/* --repo "$GH_REPO" \
            --target "$commit" \
            --title "Phong $VERSION" \
            --generate-notes

      - name: Prepare Pages site
        run: |
          mkdir -p site/screenshots
          cp source/pages/index.html source/pages/starfield.js \
            source/packaging/phong.svg source/packaging/phong.png site/
          cp source/docs/screenshots/*.png site/screenshots/
          # The game in play/, the old address of the game leads there
          unzip -q artifacts/Phong-web.zip -d site/play
          printf '<!doctype html>\n<meta http-equiv="refresh" content="0; url=play/">\n' > site/phong.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5