<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#0f1b47"/>
      <stop offset="1" stop-color="#05091a"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="11" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="yellowBall" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset="0.22" stop-color="#fff3a6"/>
      <stop offset="0.55" stop-color="#ffe65c"/>
      <stop offset="1" stop-color="#c98a00"/>
    </radialGradient>
    <radialGradient id="pinkBall" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#ffc2dc"/>
      <stop offset="0.55" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#6e0f45"/>
    </radialGradient>
    <radialGradient id="titleBall" cx="36%" cy="30%" r="72%">
